name: macOS tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Build and test native editor and SVG export
        run: ./script/test.sh
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Test image-to-vector detail preservation
        run: |
          python3 -m venv .build/artwork-tests
          .build/artwork-tests/bin/python -m pip install --disable-pip-version-check vtracer==0.6.15 svgpathtools==1.8.0
          .build/artwork-tests/bin/python -m unittest discover -s Tests/Artwork -v
